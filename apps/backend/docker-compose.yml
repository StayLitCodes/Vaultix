services:
  postgres:
    image: postgres:15
    container_name: vaultix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaultix_db
      POSTGRES_USER: vaultix_user
      POSTGRES_PASSWORD: vaultix_pass
    ports:
      - '5432:5432'
    volumes:
      - vaultix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vaultix_user -d vaultix_db']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vaultix_postgres_data:
