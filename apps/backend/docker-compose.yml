services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vaultix_db}
      POSTGRES_USER: ${POSTGRES_USER:-vaultix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaultix_pass}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - vaultix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vaultix_postgres_data:
