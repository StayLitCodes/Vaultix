[package]
name = "onchain"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "=29.0.1"
num-bigint = { version = "=0.4.6", default-features = false }

[dev-dependencies]
soroban-sdk = { version = "=29.0.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
