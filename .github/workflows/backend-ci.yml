name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build:
    name: Build and Test (${{ matrix.database }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/backend

    strategy:
      matrix:
        database: [sqlite, postgres]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: vaultix
          POSTGRES_PASSWORD: vaultix_password
          POSTGRES_DB: vaultix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint
        if: matrix.database == 'sqlite'

      - name: Build
        run: pnpm run build
        if: matrix.database == 'sqlite'

      - name: Set environment variables for Postgres
        if: matrix.database == 'postgres'
        run: |
          echo "DATABASE_DRIVER=postgres" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql://vaultix:vaultix_password@localhost:5432/vaultix_test" >> $GITHUB_ENV

      - name: Run Migrations
        run: pnpm run migration:run

      - name: Test
        run: pnpm run test
