name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build:
    name: Build and Test (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vaultix
          POSTGRES_PASSWORD: vaultix
          POSTGRES_DB: vaultix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaultix -d vaultix"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./apps/backend

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Configure database
        shell: bash
        run: |
          if [ "${{ matrix.database }}" = "postgres" ]; then
            echo "DATABASE_DRIVER=postgres" >> "$GITHUB_ENV"
            echo "DATABASE_URL=postgres://vaultix:vaultix@localhost:5432/vaultix" >> "$GITHUB_ENV"
          else
            echo "DATABASE_DRIVER=sqlite" >> "$GITHUB_ENV"
            echo "DATABASE_PATH=:memory:" >> "$GITHUB_ENV"
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Run migrations
        run: npm run migration:run
