name: CI

# The path-scoped workflows own frontend, backend, contract, and mobile checks.
# Keep this workflow manual so a push or pull request cannot execute those jobs twice.
on:
  workflow_dispatch:

jobs:
  guidance:
    name: Use path-scoped checks
    runs-on: ubuntu-latest
    steps:
      - run: echo "Frontend, backend, contract, mobile, and API smoke checks run in their path-scoped workflows."
